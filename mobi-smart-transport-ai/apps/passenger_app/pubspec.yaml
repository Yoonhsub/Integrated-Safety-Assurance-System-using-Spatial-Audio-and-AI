name: mobi_passenger_app
description: MOBI Passenger App skeleton.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  camera: 0.12.0+2
  tflite_flutter: 0.12.1
  file_picker: 13.1.0
  image: 4.12.0
  crypto: 3.0.7
  audioplayers: ^6.5.1
  mobi_mobile_auth:
    path: ../../packages/mobile_auth
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_tts: ^4.2.5
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  web: ^1.1.1
  mobi_mobile_sensors:
    path: ../../packages/mobile_sensors
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock_voice/
  shaders:
    - assets/shaders/voice_aurora.frag
